<text x="30" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#f0f6fc" font-weight="600" xml:space="preserve">   1. Copy a PreparedRequest's CookieJar reliably</text>
<text x="30" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#8b949e" xml:space="preserve">    2015-04-06 · 36093e69 · Ian Cordasco · change · 100% match</text>
<text x="30" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#c9d1d9" xml:space="preserve">    By adding _copy_cookie_jar we can reliably copy cookie jars so that we have an</text>
<text x="30" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#c9d1d9" xml:space="preserve">    actual copy instead of the same instance on different prepared requests.</text>
<text x="30" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#79c0ff" xml:space="preserve">    requests/cookies.py  requests/models.py</text>
<text x="30" y="347" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#58a6ff" text-decoration="underline" xml:space="preserve">    → https://github.com/psf/requests/commit/36093e69c70b9b24dd1e007befa35ad891313f51</text>
<text x="30" y="389" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#f0f6fc" font-weight="600" xml:space="preserve">   2. Test and perfection for cookie handling.</text>
<text x="30" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#8b949e" xml:space="preserve">    2013-02-11 · 2e316961 · Ian Cordasco · fix · 71% match</text>
<text x="30" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#c9d1d9" xml:space="preserve">    I also fixed up some of the RequestsCookieJar methods so using</text>
