name: Idea
description: A command, integration or signal whygit should have
title: 'idea: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out
      description: Describe the question you had about your codebase, not the feature
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      render: shell
    validations:
      required: false
  - type: textarea
    id: idea
    attributes:
      label: What you would like whygit to do
    validations:
      required: false
